<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f17"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.35"/>

  <!-- Code brackets -->
  <text x="48" y="322" font-family="'JetBrains Mono','Courier New',monospace" font-weight="700" font-size="160" fill="url(#accent)" opacity="0.95">&lt;</text>
  <text x="382" y="322" font-family="'JetBrains Mono','Courier New',monospace" font-weight="700" font-size="160" fill="url(#accent)" opacity="0.95">&gt;</text>

  <!-- Monogram -->
  <text x="256" y="308" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="132" fill="#f5f5f7" letter-spacing="-2">GD</text>

  <!-- Small accent dot -->
  <circle cx="256" cy="130" r="11" fill="url(#accent)"/>
</svg>
